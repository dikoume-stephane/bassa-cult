<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple Grid Layout 2x3</title>
    <link rel="stylesheet" href="rien.css">
</head>
<body>

    <h1>Ma grille 2 colonnes / 3 lignes</h1>

    <!-- Le conteneur parent qui va utiliser le CSS Grid -->
    <div class="grid-container">
        <div class="item">Bloc 1</div>
        <div class="item">Bloc 2</div>
        <div class="item">Bloc 3</div>
        <div class="item">Bloc 4</div>
        <div class="item">Bloc 5</div>
        <div class="item">Bloc 6</div>
        <div class="item">Bloc 6</div>
        <div class="item">Bloc 6</div>
        <div class="item">Bloc 6</div>
        <div class="item">Bloc 6</div>
    </div>

    <!-- 🧱 HTML : La structure -->
    <div id="divSurveillance">
        <h2>Div à Survoler</h2>
        <p>Passez votre curseur par-dessus cette boîte pour voir l'effet de surbrillance.</p>
    </div>
    <!-- Le Fleuve Sanaga qui traverse l'histoire -->
    <svg class="sanaga-river" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M 50,0 
               C 65,16 65,16 50,33 
               C 35,50 35,50 50,66 
               C 65,83 65,83 50,100" />
    </svg>
    
</body>
</html>
